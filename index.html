<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Inventario de Papelería</title>
</head>
<body>

    <div class="container">
        <h1>Control de Existencias</h1>
        
        <!-- Buscador en tiempo real -->
        <input type="text" id="searchInput" class="search-box" placeholder="Buscar producto por nombre o categoría...">

        <!-- Tabla de Inventario -->
        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Cantidad Disponible</th>
                    <th>Acciones</th> <!-- 👈 1. Agregamos esta columna aquí -->
                </tr>
            </thead>
            <tbody id="inventoryTableBody">
                <!-- Los datos y botones se insertarán dinámicamente con JavaScript -->
            </tbody>
        </table>
    </div>
    
    <!-- SECCIÓN DE HISTORIAL DE VENTAS -->
    <div style="margin-top: 40px;">
        <h2>Historial de Ventas</h2>
        <table>
            <thead>
                <tr>
                    <th>ID Venta</th>
                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Fecha y Hora</th>
                </tr>
            </thead>
            <tbody id="salesHistoryTableBody">
                <tr>
                    <td colspan="4" style="text-align: center; color: #777;">No hay ventas registradas aún.</td>
                </tr>
            </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
