<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Inventario de Tienda</title>
</head>
<body>

    <div class="container">
        <h1>Control de Existencias</h1>
        
        <!-- Buscador en tiempo real -->
        <input type="text" id="searchInput" class="search-box" placeholder="Buscar producto por nombre o categoría...">

        <!-- Tabla de Inventario -->
        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Cantidad Disponible</th>
                </tr>
            </thead>
            <tbody id="inventoryTableBody">
                <!-- Los datos se insertarán dinámicamente con JavaScript -->
            </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
